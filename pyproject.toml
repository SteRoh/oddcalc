[project]
name = "oddcalc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "eval7>=0.1 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "mss>=9.0",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pyqt6>=6.7",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
